[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The multiplication sign is a real character in plan text ("3.5 × 4.2"); the parser and
# its tests must handle it literally, so the ambiguous-character rule does not apply.
"app/pipeline/parse_dims.py" = ["RUF001"]
# The Anthropic SDK does not export its response types, so Any is the honest annotation.
"app/llm.py" = ["ANN401"]
"app/batch.py" = ["ANN401"]
"tests/test_parse_dims.py" = ["RUF001"]
"tests/*" = ["ANN"]
"alembic/*" = ["ANN", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
