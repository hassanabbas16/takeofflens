# Anthropic API pricing, USD per 1,000,000 tokens.
#
# Cost is computed from this file, never hardcoded in pipeline logic, so a price change
# never requires a code change and a logged token count stays true whatever prices do later.
#
# Source: https://platform.claude.com/docs/en/about-claude/pricing
# Checked: 2026-09-17
# Mode: Standard, global inference. Batch API is 50% of these on both input and output.
#       `inference_geo: "us"` applies a 1.1x multiplier and is NOT modelled here.
#
# Token accounting note: Anthropic reports `input_tokens` EXCLUDING cached tokens, with
# `cache_read_input_tokens` and `cache_creation_input_tokens` as separate counters. The four
# are summed independently - see api/app/pricing.py. Treating cache reads as a subset of
# input (the OpenAI shape) would undercount.
#
# cache_write below is the 5-minute write rate (1.25x base input). The 1-hour rate is 2x
# base input and is not used by this pipeline, which makes single-shot calls per page.

checked: "2026-09-17"
source: "https://platform.claude.com/docs/en/about-claude/pricing"
mode: standard
currency: USD
unit: per_1m_tokens

models:
  claude-haiku-4-5:
    input: 1.00
    output: 5.00
    cache_read: 0.10
    cache_write: 1.25
    note: "default; cheapest current model, 200K context, vision supported"
  claude-sonnet-5:
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50
    note: "step up if Haiku recall is insufficient; 1M context"
  claude-opus-5:
    input: 5.00
    output: 25.00
    cache_read: 0.50
    cache_write: 6.25
  claude-fable-5-1:
    input: 10.00
    output: 50.00
    cache_read: 0.25
    cache_write: 12.50
    note: "cache reads are 0.025x base input on this model, not the usual 0.1x"

# Used when a model id is not in the table. Cost is reported as null rather than guessed.
unknown_model_cost: null
