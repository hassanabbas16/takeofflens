services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # ANTHROPIC_API_KEY is deliberately NOT passed here. The key is read from the
      # mounted .env file only, so an ambient shell variable can never pay for this
      # project's calls. See api/app/config.py.
      ANTHROPIC_TEXT_MODEL: ${ANTHROPIC_TEXT_MODEL}
      ANTHROPIC_VISION_MODEL: ${ANTHROPIC_VISION_MODEL}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-8000}
      ANTHROPIC_TEMPERATURE: ${ANTHROPIC_TEMPERATURE:-0}
      VLM_MAX_IMAGE_PX: ${VLM_MAX_IMAGE_PX:-1536}
      PRICING_PATH: ${PRICING_PATH:-/eval/pricing.yaml}
      STORAGE_DIR: ${STORAGE_DIR:-/storage}
      DATASET_DIR: ${DATASET_MOUNT:-/data/cubicasa5k}
      DATASET_COCO_DIR: ${DATASET_COCO_MOUNT:-/data/cubicasa5k_coco}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      # Weights are baked into the image at build time; this stops Paddle probing the
      # model host on every process start.
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./api:/app
      # The key lives here and is read from the file, never from the environment.
      - ./.env:/app/.env:ro
      - ./eval:/eval
      # Demo tooling runs inside this container rather than a second one: a second api
      # container loading PaddleOCR against the shared model volume left the running
      # container's OCR crashing natively on every orientation.
      - ./docs:/docs:ro
      - takeoff_storage:/storage
      # Named volume for OCR weights. The image already carries them, so this only
      # persists anything a newer model pulls at runtime.
      - ocr_models:/root/.paddlex
      # Dataset is mounted read-only and never copied into the repo.
      - ${DATASET_DIR}:${DATASET_MOUNT:-/data/cubicasa5k}:ro
      - ${DATASET_COCO_DIR}:${DATASET_COCO_MOUNT:-/data/cubicasa5k_coco}:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Host file edits reach the container through a bind mount, which does not deliver
      # inotify events on Windows/macOS Docker. Without polling the Next dev server simply
      # never notices a change and hot reload silently does nothing.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    command: npm run dev

volumes:
  pgdata:
  takeoff_storage:
  ocr_models:
